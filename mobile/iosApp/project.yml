name: Clipo
options:
  bundleIdPrefix: app.clipo
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  Clipo:
    type: application
    platform: iOS
    sources: [Sources, Resources, ../fonts]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Clipo
        UIAppFonts: [ClipoReadingSans.ttf, ClipoReadingSerif.ttf]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 连接你在局域网中部署的 Clipo 服务器。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.clipo.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework ClipoShared -lsqlite3
    preBuildScripts:
      - name: Build Kotlin shared framework
        script: |
          set -eu
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
        basedOnDependencyAnalysis: false
  ClipoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Clipo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Clipo:
    build:
      targets:
        Clipo: all
    test:
      targets: [ClipoTests]
