name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '已通过 CI 的版本标签，例如 v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - name: Validate tag and wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$TAG" = "v$(python3 -c 'import json; print(json.load(open("extension/manifest.json"))["version"])')"
          sha=$(git rev-parse HEAD)
          for attempt in $(seq 1 60); do
            result=$(gh run list --workflow ci.yml --commit "$sha" --limit 10 --json status,conclusion --jq '.[] | select(.status == "completed") | .conclusion' | head -1)
            if [ "$result" = success ]; then exit 0; fi
            if [ -n "$result" ]; then echo "CI did not pass: $result"; exit 1; fi
            sleep 15
          done
          echo "CI timeout"; exit 1
      - name: Package extension and checksums
        run: |
          make extension-package
          cd extension/out
          sha256sum *.zip > SHA256SUMS
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "Clipo $TAG" --notes-file docs/releases/v0.1.0.md
          fi
          gh release upload "$TAG" extension/out/*.zip extension/out/SHA256SUMS --clobber
