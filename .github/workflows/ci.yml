name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_PASSWORD: clipo-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: make install
      - run: make lint
      - run: make test
      - name: PostgreSQL capture, backup, note capabilities and migrations
        run: >-
          .venv/bin/pytest backend/tests/integration/test_backups.py
          backend/tests/integration/test_backup_targets.py
          backend/tests/integration/test_summary_jobs.py
          backend/tests/integration/test_sharing.py
          backend/tests/integration/test_note_limits.py
          backend/tests/integration/test_rich_content.py
          backend/tests/integration/test_xiaoheihe_capture.py
          backend/tests/integration/test_payload_capture.py
          backend/tests/integration/test_migrations.py
          backend/tests/integration/test_annotations.py
          backend/tests/integration/test_note_exports.py
          backend/tests/integration/test_semantic_search.py
          backend/tests/integration/test_memory_gallery.py
          backend/tests/integration/test_conversations.py
          backend/tests/integration/test_model_usage.py
          --postgres-url postgresql+psycopg://postgres:clipo-ci-only@localhost:5432/postgres
      - name: Generated contract is current
        run: make gen-api && git diff --exit-code -- frontend/openapi.json frontend/lib/api-types.ts
      - run: make build
      - name: Install Chromium
        run: uv run --no-project --with playwright python -m playwright install --with-deps chromium
      - name: Browser PWA install and update
        run: uv run --no-project --with playwright python scripts/smoke_capture.py --pwa-only
      - name: Browser export and empty-instance restore
        run: uv run --no-project --with playwright python scripts/smoke_backup.py
      - name: Browser summary and public sharing
        run: uv run --no-project --with playwright python scripts/smoke_notes.py
      - name: Browser ordered articles and platform DOM
        run: uv run --no-project --with playwright python scripts/smoke_article.py
      - name: Browser annotations and reading styles
        run: uv run --no-project --with playwright python scripts/smoke_annotations.py
      - name: Browser single-note downloads and PDF printing
        run: uv run --no-project --with playwright python scripts/smoke_note_export.py
      - name: Browser semantic search and offline fallback
        run: uv run --no-project --with playwright python scripts/smoke_semantic_search.py
      - name: Browser memory gallery and reading activity
        run: uv run --no-project --with playwright python scripts/smoke_memory_gallery.py
      - name: Browser private AI conversations
        run: uv run --no-project --with playwright python scripts/smoke_conversations.py
      - run: make extension-package
      - uses: actions/upload-artifact@v4
        with:
          name: clipo-extension
          path: extension/out/*.zip
          if-no-files-found: error
  image:
    runs-on: ubuntu-latest
    needs: checks
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: clipo-app:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - name: First deployment from README
        env:
          CLIPO_IMAGE: clipo-app:latest
        run: |
          python3 scripts/init_env.py
          docker compose build db
          docker compose up -d --no-build --wait --wait-timeout 120
          uv run --no-project --with playwright python -m playwright install --with-deps chromium
          uv run --no-project --with playwright python scripts/smoke_compose.py --base-url http://127.0.0.1:8000
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag clipo-app:latest "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "main has advanced; published commit image only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for tag in main latest; do
            docker tag clipo-app:latest "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Published $image:main, $image:latest and $image:sha-$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Stop temporary instance
        if: always()
        run: docker compose down --volumes
