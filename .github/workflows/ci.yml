name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: clipo-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: make install
      - run: make lint
      - run: make test
      - name: PostgreSQL backup and migrations
        run: >-
          .venv/bin/pytest backend/tests/integration/test_backups.py
          backend/tests/integration/test_backup_targets.py
          backend/tests/integration/test_migrations.py
          --postgres-url postgresql+psycopg://postgres:clipo-ci-only@localhost:5432/postgres
      - name: Generated contract is current
        run: make gen-api && git diff --exit-code -- frontend/openapi.json frontend/lib/api-types.ts
      - run: make build
      - name: Install Chromium
        run: uv run --no-project --with playwright python -m playwright install --with-deps chromium
      - name: Browser export and empty-instance restore
        run: uv run --no-project --with playwright python scripts/smoke_backup.py
      - run: make extension-package
      - uses: actions/upload-artifact@v4
        with:
          name: clipo-extension
          path: extension/out/*.zip
          if-no-files-found: error
  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clipo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
