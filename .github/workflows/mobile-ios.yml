name: Mobile iOS
on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - run: brew install xcodegen swiftlint
      - run: swiftlint lint --strict
        working-directory: mobile/iosApp
      - run: xcodegen generate
        working-directory: mobile/iosApp
      - name: Create isolated iOS 18.6 simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          runtime = next(runtime for runtime in devices['devices'] if 'iOS-18-6' in runtime)
          device = subprocess.check_output(['xcrun', 'simctl', 'create', 'Clipo M0 CI', 'com.apple.CoreSimulator.SimDeviceType.iPhone-16', runtime], text=True).strip()
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CLIPO_SIMULATOR=' + device + '\n')
          PY
      - name: Build simulator tests
        timeout-minutes: 20
        working-directory: mobile
        run: >-
          xcodebuild -project iosApp/Clipo.xcodeproj -scheme Clipo -configuration Debug
          -destination "platform=iOS Simulator,id=$CLIPO_SIMULATOR"
          -derivedDataPath iosApp/DerivedData -resultBundlePath test-results/ios-build.xcresult
          CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES build-for-testing
      - name: Boot simulator
        timeout-minutes: 5
        run: |
          xcrun simctl boot "$CLIPO_SIMULATOR"
          xcrun simctl bootstatus "$CLIPO_SIMULATOR" -b
      - name: Simulator tests
        timeout-minutes: 8
        working-directory: mobile
        run: >-
          xcodebuild -project iosApp/Clipo.xcodeproj -scheme Clipo -configuration Debug
          -destination "platform=iOS Simulator,id=$CLIPO_SIMULATOR"
          -derivedDataPath iosApp/DerivedData -resultBundlePath test-results/ios-tests.xcresult
          -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1
          -test-timeouts-enabled YES -default-test-execution-time-allowance 60
          -maximum-test-execution-time-allowance 120 test-without-building
      - name: Capture simulator launch
        timeout-minutes: 2
        run: |
          xcrun simctl launch "$CLIPO_SIMULATOR" app.clipo.ios
          sleep 3
          xcrun simctl io "$CLIPO_SIMULATOR" screenshot mobile/test-results/ios-server.png
      - name: Build unsigned app
        timeout-minutes: 20
        working-directory: mobile
        run: >-
          xcodebuild -project iosApp/Clipo.xcodeproj -scheme Clipo -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath iosApp/DerivedData
          CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA
        working-directory: mobile/iosApp
        run: |
          mkdir -p build/Payload
          cp -R DerivedData/Build/Products/Release-iphoneos/Clipo.app build/Payload/
          cd build
          zip -qr Clipo-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-ios-unsigned
          path: mobile/iosApp/build/Clipo-unsigned.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ios-tests
          path: mobile/test-results/
