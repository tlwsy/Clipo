name: Mobile Android
on:
  push:
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: ./gradlew :androidApp:assembleDebug :androidApp:lintDebug :androidApp:ktlintCheck
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
