repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --config backend/pyproject.toml --fix
        language: system
        types: [python]
      - id: black
        name: black
        entry: .venv/bin/black --config backend/pyproject.toml
        language: system
        types: [python]
      - id: frontend-lint
        name: eslint and TypeScript
        entry: npm --prefix frontend run lint
        language: system
        files: ^frontend/.*\.(ts|tsx|js|mjs)$
        pass_filenames: false
