[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipo-backend"
version = "0.1.0"
description = "Self-hosted Clipo API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.121,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "cryptography>=44,<49",
  "httpx>=0.28,<1",
  "huey>=2.5,<3",
  "trafilatura>=2,<3",
  "readability-lxml>=0.8,<1",
  "xhshow==0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "black>=25,<27", "pre-commit>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
