<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>与网站名称不同的文章标题</title>
  <meta name="application-name" content="备用应用名">
  <meta property="og:site_name" content="  知识 &amp; 阅读  ">
</head>
<body><article>
  <h1>与网站名称不同的文章标题</h1>
  <p>采集网页时保留网站自己提供的名称，让读者可以辨认内容来自哪个站点。文章标题与作者都不应该被当作网站名称。</p>
  <p>如果站点没有提供名称，应用可以显示链接的域名，避免推测来源。已有笔记也可以读取保存的网页快照中的站点元数据。</p>
</article></body>
</html>
